apiVersion: bootstrap.mindclade.dev/v1
kind: IdentityFederation
metadata:
  name: bootstrap-identity
spec:
  workforce:
    projectRef: identity-root
    location: global
    poolId: mindclade-workforce
    providerId: primary-idp
    protocol: oidc
    issuerUri:
      valueFrom:
        env: WORKFORCE_OIDC_ISSUER_URI
    clientId:
      valueFrom:
        env: WORKFORCE_OIDC_CLIENT_ID
    clientSecret:
      valueFrom:
        env: WORKFORCE_OIDC_CLIENT_SECRET
    administratorGroup:
      valueFrom:
        env: WORKFORCE_ADMIN_GROUP
    attributeMapping:
      subject: assertion.sub
      displayName: assertion.name
      groups: assertion.groups
  workloadIdentityProviders:
    github:
      platform: github
      projectRef: identity-root
      poolId: bootstrap-github
      providerId: github-actions
      issuerUri:
        valueFrom:
          env: GITHUB_OIDC_ISSUER_URI
      allowedAudience:
        literal: sts.googleapis.com
      subjectClaim: assertion.sub
      requiredClaims:
        repository_owner_id:
          literal: "316676129"
        repository_id:
          literal: "1350991612"
        ref:
          literal: refs/heads/main
        workflow_ref:
          literal: mindclade/bootstrap/.github/workflows/protected-apply.yml@refs/heads/main
      serviceAccounts:
        plan:
          projectRef: state-root
          accountId: bootstrap-plan
          roles:
            - custom/bootstrapAuditPlanRead
            - custom/bootstrapOrganizationPlanRead
            - custom/bootstrapRecoveryPlanObjectRead
            - custom/bootstrapRecoveryPlanRead
            - custom/bootstrapStatePlanLock
            - roles/browser
            - roles/cloudkms.viewer
            - roles/iam.roleViewer
            - roles/iam.securityReviewer
            - roles/iam.serviceAccountViewer
            - roles/iam.workforcePoolViewer
            - roles/privilegedaccessmanager.viewer
            - roles/serviceusage.serviceUsageViewer
            - roles/storage.legacyBucketReader
            - roles/storage.objectViewer
            - roles/storagetransfer.viewer
        apply:
          projectRef: state-root
          accountId: bootstrap-apply
          roles:
            - roles/cloudkms.admin
            - roles/iam.workloadIdentityPoolAdmin
            - roles/logging.configWriter
            - roles/privilegedaccessmanager.admin
            - roles/resourcemanager.projectIamAdmin
            - roles/serviceusage.serviceUsageAdmin
            - roles/storage.objectAdmin
        recovery:
          projectRef: recovery-root
          accountId: bootstrap-recovery
          roles:
            - custom/bootstrapRecoverySigningMetadata
            - custom/bootstrapRecoverySinkRead
            - roles/cloudkms.signerVerifier
            - roles/logging.viewAccessor
            - roles/storage.legacyBucketReader
            - roles/storage.objectViewer
    github-config:
      platform: github
      projectRef: identity-root
      activationEnabled: false
      poolId: github-config
      issuerUri:
        valueFrom:
          env: GITHUB_OIDC_ISSUER_URI
      subjectClaim: assertion.sub
      repositoryOwnerId:
        literal: "316676129"
      repositoryId:
        literal: "1350986053"
      immutableRepository:
        literal: mindclade@316676129/github-config@1350986053
      repositoryFullName:
        literal: mindclade/github-config
      branchRef:
        literal: refs/heads/main
      identities:
        plan:
          providerId: github-config-plan
          serviceAccountId: github-config-plan
          subjects:
            - id: github-config-drift-plan
              workflowRef: mindclade/github-config/.github/workflows/drift-detection.yml@refs/heads/main
              contextType: ref
              contextValue: refs/heads/main
              audience: sts.googleapis.com
            - id: github-config-protected-plan
              workflowRef: mindclade/github-config/.github/workflows/protected-apply.yml@refs/heads/main
              contextType: environment
              contextValue: trusted-build
              audience: sts.googleapis.com
        apply:
          providerId: github-config-apply
          serviceAccountId: github-config-apply
          subjects:
            - id: github-config-protected-apply
              workflowRef: mindclade/github-config/.github/workflows/protected-apply.yml@refs/heads/main
              contextType: environment
              contextValue: infrastructure-apply
              audience: sts.googleapis.com
    github-infrastructure:
      platform: github
      projectRef: identity-root
      poolId: infrastructure-live
      issuerUri:
        valueFrom:
          env: GITHUB_OIDC_ISSUER_URI
      subjectClaim: assertion.sub
      repositoryOwnerId:
        literal: "316676129"
      repositoryId:
        literal: "1350992171"
      immutableRepository:
        literal: mindclade@316676129/infrastructure-live@1350992171
      repositoryFullName:
        literal: mindclade/infrastructure-live
      branchRef:
        literal: refs/heads/main
      workflowRef:
        literal: mindclade/infrastructure-live/.github/workflows/protected-apply.yml@refs/heads/main
      drift:
        activationEnabled: false
        subjectId: infrastructure-drift-plan
        providerId: infrastructure-plan
        serviceAccountId: infrastructure-plan
        workflowRef: mindclade/infrastructure-live/.github/workflows/drift-detection.yml@refs/heads/main
        environment: trusted-build
        allowedAudience: sts.googleapis.com
      identities:
        development-plan:
          providerId: development-plan
          environment: trusted-build
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/development/plan
          serviceAccount:
            projectRef: identity-root
            accountId: development-plan
            roles: []
        development-apply:
          providerId: development-apply
          environment: infrastructure-apply
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/development/apply
          serviceAccount:
            projectRef: identity-root
            accountId: development-apply
            roles: []
        staging-plan:
          providerId: staging-plan
          environment: trusted-build
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/staging/plan
          serviceAccount:
            projectRef: identity-root
            accountId: staging-plan
            roles: []
        staging-apply:
          providerId: staging-apply
          environment: infrastructure-apply
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/staging/apply
          serviceAccount:
            projectRef: identity-root
            accountId: staging-apply
            roles: []
        production-plan:
          providerId: production-plan
          environment: trusted-build
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/production/plan
          serviceAccount:
            projectRef: identity-root
            accountId: production-plan
            roles: []
        production-apply:
          providerId: production-apply
          environment: infrastructure-apply
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/production/apply
          serviceAccount:
            projectRef: identity-root
            accountId: production-apply
            roles: []
        restricted-plan:
          providerId: restricted-plan
          environment: trusted-build
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/restricted/plan
          serviceAccount:
            projectRef: identity-root
            accountId: restricted-plan
            roles: []
        restricted-apply:
          providerId: restricted-apply
          environment: infrastructure-apply
          allowedAudience:
            literal: https://github.mindclade.io/oidc/infrastructure-live/restricted/apply
          serviceAccount:
            projectRef: identity-root
            accountId: restricted-apply
            roles: []
    github-ci-evidence:
      platform: github
      projectRef: identity-root
      activationEnabled: false
      poolId: github-ci-evidence
      issuerUri:
        valueFrom:
          env: GITHUB_OIDC_ISSUER_URI
      subjectClaim: assertion.sub
      repositoryOwnerId:
        literal: "316676129"
      repositoryIds:
        bootstrap:
          literal: "1350991612"
        dot-github:
          literal: "1350980188"
        github-config:
          literal: "1350986053"
        gitops:
          literal: "1350991963"
        infrastructure-live:
          literal: "1350992171"
        mindclade:
          literal: "1350990078"
      writer:
        providerId: writer
        jobWorkflowRef:
          valueFrom:
            env: GITHUB_CI_EVIDENCE_JOB_WORKFLOW_REF
        allowedEvents:
          - push
          - release
        branchRef: refs/heads/main
        releaseTagPrefix: refs/tags/v
        serviceAccount:
          projectRef: identity-root
          accountId: ci-evidence-writer
          roles: []
      verifier:
        providerId: verifier
        repositoryId:
          literal: "1350992171"
        workflowRef:
          literal: mindclade/infrastructure-live/.github/workflows/disaster-recovery.yml@refs/heads/main
        workflowSha:
          valueFrom:
            env: INFRASTRUCTURE_LIVE_DISASTER_RECOVERY_WORKFLOW_SHA
        allowedEvents:
          - workflow_dispatch
        ref:
          literal: refs/heads/main
        environment: infrastructure-apply
        serviceAccount:
          projectRef: identity-root
          accountId: ci-evidence-verifier
          roles: []
    buildkite:
      platform: buildkite
      projectRef: identity-root
      poolId: bootstrap-buildkite
      providerId: buildkite
      issuerUri:
        valueFrom:
          env: BUILDKITE_OIDC_ISSUER_URI
      allowedAudience:
        valueFrom:
          env: BUILDKITE_OIDC_AUDIENCE
      subjectClaim: assertion.sub
      requiredClaims:
        organization_slug:
          valueFrom:
            env: BUILDKITE_ORGANIZATION_SLUG
        pipeline_slug:
          valueFrom:
            env: BUILDKITE_PIPELINE_SLUG
        pipeline_id:
          valueFrom:
            env: BUILDKITE_PIPELINE_ID
        build_branch:
          literal: main
        step_key:
          literal: bootstrap-ring0-signing
      serviceAccounts:
        bootstrap:
          projectRef: state-root
          accountId: buildkite-bootstrap
          roles:
            - roles/cloudkms.signerVerifier
    gitops:
      platform: gitops
      projectRef: identity-root
      poolId: bootstrap-gitops
      providerId: gitops
      issuerUri:
        valueFrom:
          env: GITOPS_OIDC_ISSUER_URI
      allowedAudience:
        valueFrom:
          env: GITOPS_OIDC_AUDIENCE
      subjectClaim: assertion.sub
      requiredClaims:
        repository:
          valueFrom:
            env: GITOPS_REPOSITORY
        ref:
          literal: refs/heads/main
        subject:
          valueFrom:
            env: GITOPS_IMMUTABLE_SUBJECT
      serviceAccounts:
        bootstrap:
          projectRef: recovery-root
          accountId: gitops-bootstrap
          roles: []
  activation:
    state: blocked
    activeSubjectIds:
      - bootstrap-protected-plan
      - bootstrap-protected-apply
      - bootstrap-recovery-verification
      - infrastructure-live-development-plan
      - infrastructure-live-development-apply
      - infrastructure-live-staging-plan
      - infrastructure-live-staging-apply
      - infrastructure-live-production-plan
      - infrastructure-live-production-apply
      - infrastructure-live-restricted-plan
      - infrastructure-live-restricted-apply
    gatedSubjectIds:
      - github-config-drift-plan
      - github-config-protected-plan
      - github-config-protected-apply
      - infrastructure-drift-plan
      - infrastructure-ci-evidence-verifier
    blockers:
      - github-config-control-plane-federation-not-connected-qualified
      - infrastructure-drift-federation-not-connected-qualified
      - ci-evidence-federation-not-connected-qualified
