apiVersion: mindclade.io/v1alpha1
kind: Component
metadata:
  name: bootstrap
  description: Source of truth for state, audit, federation, signing, break-glass, and recovery foundations.
  annotations:
    github.com/project-slug: mindclade/bootstrap
    mindclade.dev/security-owner: security
    mindclade.dev/authority-boundary: ring-0-only
    mindclade.dev/trust-tier: ring-0
    mindclade.dev/recovery-tier: isolated-ring-0
spec:
  type: bootstrap-control-plane
  lifecycle: pre-production
  maturity: pre-production
  owner: security
  security_reviewers:
    - security
  operational_reviewers:
    - platform-operations
  repository_class: infrastructure-source
  data_classification: public
  trust_tier: ring-0
  recovery_tier: isolated-ring-0
  production_authority: false
  dependencies: []
  provides:
    - ring0-state-backends-v1
    - ring0-federation-v1
    - ring0-recovery-evidence-v1
  release:
    strategy: protected-saved-plan
    artifact: source-commit
    immutable: true
    evidence:
      - source-qualification
      - plan-digest
      - protected-environment-approval
      - recovery-verification
  activation:
    source_ready:
      description: Source, metadata, policy, tests, and required reviews are complete; no external mutation is implied.
    connected:
      description: Requires external proof of exact-commit GitHub/GCP controls, a generation-bound isolated restore and downstream reattachment, and Blueprint A3.8/A3.9 ratification of a reusable Ring-0 workflow interface or explicit protected-control-plane exception; repository observation alone cannot qualify it.
  license: Mindclade Proprietary License
