version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /tooling
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review

  - package-ecosystem: opentofu
    directory: /opentofu/live/root-trust
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Detroit
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security-review

  - package-ecosystem: opentofu
    directory: /opentofu/live/recovery-plane
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: America/Detroit
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security-review

  - package-ecosystem: bazel
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Detroit
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security-review
